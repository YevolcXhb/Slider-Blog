name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: false
        default: "1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tag
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME#v}"
          fi
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "Building ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Check registry auth source
        run: |
          if [ "${{ secrets.GH_PAT != '' }}" = "true" ]; then
            echo "auth_source=GH_PAT"
          else
            echo "auth_source=GITHUB_TOKEN"
          fi

      - name: Delete existing GHCR package before release (requires GH_PAT)
        if: ${{ secrets.GH_PAT != '' }}
        run: |
          PACKAGE_NAME="${IMAGE_NAME##*/}"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE_NAME}")
          echo "delete_package_status=${STATUS}"
          if [ "$STATUS" != "204" ] && [ "$STATUS" != "404" ]; then
            echo "::error::Failed to delete package ${IMAGE_NAME} (HTTP ${STATUS}). Ensure GH_PAT has delete:packages scope and admin access to the package."
            exit 1
          fi

      - name: Check whether GHCR package already exists
        id: package_check
        run: |
          if docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" >/dev/null 2>&1 \
            || docker buildx imagetools inspect "${IMAGE_NAME}:latest" >/dev/null 2>&1; then
            echo "package_exists=true"
            echo "::warning::Package ${IMAGE_NAME} already exists. If push is denied with write_package, the repository must be granted Write/Admin under 'Manage Actions access' in the package settings."
          else
            echo "package_exists=false"
          fi

      - name: Try to grant repository access to existing package
        continue-on-error: true
        run: |
          PACKAGE_NAME="${IMAGE_NAME##*/}"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE_NAME}/repositories/${{ github.event.repository.id }}" \
            -d '{"permission":"write"}')
          echo "grant_status=${STATUS}"
          if [ "$STATUS" != "204" ] && [ "$STATUS" != "200" ]; then
            echo "::warning::Auto-grant failed (HTTP ${STATUS}). Grant Write/Admin to this repository under 'Manage Actions access' in the package settings, or add a GH_PAT secret with write:packages."
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min
